name: MVP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: liar
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: liar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liar -d liar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://liar:ci-only-password@localhost:5432/liar_test
      NEXT_TELEMETRY_DISABLED: 1
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Start production and verify HTTP entrypoints
        shell: bash
        run: |
          npm start > /tmp/liar-room.log 2>&1 &
          GAME_PID=$!
          trap 'kill "$GAME_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/healthz; then break; fi
            sleep 1
          done
          if ! curl -fsS http://localhost:3000/healthz; then cat /tmp/liar-room.log; exit 1; fi
          curl -fsS http://localhost:3000/ > /tmp/liar-room.html
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const html=fs.readFileSync('/tmp/liar-room.html','utf8'); assert.ok(html.includes('LIAR')); assert.ok(html.includes('ОДИН БРЕШЕ'));"
          curl -fsS http://localhost:3000/api/catalog
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: |
            test-results/
            playwright-report/
      - name: Upload resolved dependency lock and production logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-check-evidence
          path: |
            package-lock.json
            /tmp/liar-room.log
